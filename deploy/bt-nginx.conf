# 宝塔 Nginx 网站配置示例
# 站点目录建议指向：/www/wwwroot/simple-erp/frontend/dist
# API 由同一个域名的 /api 反向代理到 Node.js 后端 127.0.0.1:3001

server {
  listen 80;
  server_name testclf01.xyz www.testclf01.xyz;
  return 301 https://www.testclf01.xyz$request_uri;
}

server {
  listen 443 ssl http2;
  server_name testclf01.xyz www.testclf01.xyz;

  # 在宝塔 SSL 面板申请证书后，宝塔通常会自动生成下面两行。
  # 如果宝塔已生成证书路径，请保留宝塔生成的 ssl_certificate 配置。
  ssl_certificate     /www/server/panel/vhost/cert/www.testclf01.xyz/fullchain.pem;
  ssl_certificate_key /www/server/panel/vhost/cert/www.testclf01.xyz/privkey.pem;

  root /www/wwwroot/simple-erp/frontend/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  access_log /www/wwwlogs/simple-erp.access.log;
  error_log /www/wwwlogs/simple-erp.error.log;
}

